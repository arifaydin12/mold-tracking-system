const loadKaliplar = async () => {
    setLoading(true);
    setError(null);
    try {
        const response = await fetch(`${API_URL}/kaliplar`, { headers: getAuthHeaders() });
        if (response.status === 401) {
            // invalid token or not authenticated
            localStorage.removeItem('authToken');
            localStorage.removeItem('kullanici');
            window.location.href = 'login.html';
            return;
        }
        if (!response.ok) throw new Error('Veri yüklenemedi');
        const data = await response.json();
        setKaliplar(data);
        // update notification count based on data
        const yaklasan = data.filter(k => {
            const today = new Date();
            const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
            const termin = new Date(k.termin);
            return k.durum !== 'pasif' && termin >= today && termin <= nextWeek;
        }).length;
        const revizyonBekleyen = data.filter(k => k.durum === 'revizyon').length;
        setNotificationCount(yaklasan + revizyonBekleyen);
    } catch (error) {
        console.error('Veri yükleme hatası:', error);
        setError('Veriler yüklenirken bir hata oluştu');
        setKaliplar([]);
    } finally {
        setLoading(false);
    }
};

// load current user from server (or localStorage) and refresh stored user
const loadCurrentUser = async () => {
    const token = getAuthToken();
    if (!token) return;
    try {
        const resp = await fetch(`${API_URL}/auth/verify`, { headers: getAuthHeaders() });
        if (resp.ok) {
            const data = await resp.json();
            setCurrentUser(data.kullanici || JSON.parse(localStorage.getItem('kullanici')));
            localStorage.setItem('kullanici', JSON.stringify(data.kullanici));
        } else {
            const ls = localStorage.getItem('kullanici');
            if (ls) setCurrentUser(JSON.parse(ls));
        }
    } catch (err) {
        const ls = localStorage.getItem('kullanici');
        if (ls) setCurrentUser(JSON.parse(ls));
    }

                        proje: kalip.proje
                    }))
                ).sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
            }, [kaliplar]);

            const allRevizyonlar = useMemo(() => {
                return kaliplar.flatMap(kalip => 
                    kalip.revizyonlar.map(revizyon => ({
                        ...revizyon,
                        kalipId: kalip.id,
                        kalipKod: kalip.kod,
                        kalipAd: kalip.ad,
                        proje: kalip.proje
                    }))
                ).sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
            }, [kaliplar]);

            const allBakimlar = useMemo(() => {
                return kaliplar.flatMap(kalip => 
                    kalip.bakimlar.map(bakim => ({
                        ...bakim,
                        kalipId: kalip.id,
                        kalipKod: kalip.kod,
                        kalipAd: kalip.ad
                    }))
                ).sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
            }, [kaliplar]);

            const uniqueTedarikci = useMemo(() => {
                return [...new Set(kaliplar.map(k => k.tedarikci))];
            }, [kaliplar]);

            const exportToCSV = useCallback(() => {
                const headers = ['Kalıp Kodu', 'Kalıp Adı', 'Proje', 'Durum', 'Tedarikçi', 'Göz Sayısı', 'Malzeme', 'Termin', 'Maliyet', 'Ödeme Durumu'];
                const rows = filteredKaliplar.map(k => [
                    k.kod, k.ad, k.proje, k.durum, k.tedarikci, k.gozSayisi, k.malzeme, k.termin, k.maliyet, k.odemeDurumu
                ]);
                
                const csvContent = [headers, ...rows].map(row => row.join(',')).join('\n');
                const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `kalip_listesi_${getTodayDate()}.csv`;
                link.click();
            }, [filteredKaliplar]);

            const getDurumBadge = (durum) => {
                const badges = {
                    aktif: { bg: 'bg-green-100', text: 'text-green-700', Icon: Icons.CheckCircle, label: 'Aktif' },
                    revizyon: { bg: 'bg-orange-100', text: 'text-orange-700', Icon: Icons.AlertCircle, label: 'Revizyon' },
                    deneme: { bg: 'bg-blue-100', text: 'text-blue-700', Icon: Icons.Clock, label: 'Deneme' },
                    pasif: { bg: 'bg-gray-100', text: 'text-gray-700', Icon: Icons.XCircle, label: 'Pasif' }
                };
                const { bg, text, Icon, label } = badges[durum] || badges.pasif;
                return (
                    <span className={`${bg} ${text} px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1 w-fit`}>
                        <Icon />
                        {label}
                    </span>
                );
            };

            const StatCard = ({ title, value, change, Icon, color, subtitle }) => (
                <div className="stat-card bg-white rounded-xl p-6">
                    <div className="flex items-center justify-between">
                        <div className="flex-1">
                            <p className="text-sm text-gray-600 mb-1">{title}</p>
                            <h3 className="text-3xl font-bold text-gray-900 mb-1">{value}</h3>
                            {subtitle && <p className="text-xs text-gray-500">{subtitle}</p>}
                            {change !== undefined && (
                                <div className={`flex items-center gap-1 mt-2 text-sm ${change >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                    {change >= 0 ? <Icons.TrendingUp /> : <Icons.TrendingDown />}
                                    <span>{Math.abs(change)}% bu ay</span>
                                </div>
                            )}
                        </div>
                        <div className={`${color} p-4 rounded-xl`}>
                            <Icon />
                        </div>
                    </div>
                </div>
            );

            const Dashboard = () => {
                const stats = useMemo(() => {
                    const toplamMaliyet = kaliplar.reduce((sum, k) => sum + k.maliyet, 0);
                    const aktifKaliplar = kaliplar.filter(k => k.durum === 'aktif').length;
                    const revizyonBekleyen = kaliplar.filter(k => k.durum === 'revizyon').length;
                    const toplamDeneme = allDenemeler.length;
                    const toplamRevizyon = allRevizyonlar.length;
                    const revizyonMaliyeti = allRevizyonlar.reduce((sum, r) => sum + r.fiyat, 0);
                    
                    return {
                        toplamMaliyet,
                        aktifKaliplar,
                        revizyonBekleyen,
                        toplamDeneme,
                        toplamRevizyon,
                        revizyonMaliyeti
                    };
                }, []);

                const yaklasanTerminler = useMemo(() => {
                    const today = new Date();
                    const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
                    return kaliplar.filter(k => {
                        const termin = new Date(k.termin);
                        return k.durum !== 'pasif' && termin >= today && termin <= nextWeek;
                    }).sort((a, b) => new Date(a.termin) - new Date(b.termin));
                }, []);

                return (
                    <div className="space-y-6 fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <StatCard 
                                title="Toplam Kalıp" 
                                value={kaliplar.length} 
                                change={12}
                                Icon={Icons.Package} 
                                color="bg-blue-500 text-white"
                                subtitle={`${stats.aktifKaliplar} aktif çalışıyor`}
                            />
                            <StatCard 
                                title="Aktif Kalıp" 
                                value={stats.aktifKaliplar} 
                                change={8}
                                Icon={Icons.CheckCircle} 
                                color="bg-green-500 text-white"
                                subtitle="Üretimde kullanılıyor"
                            />
                            <StatCard 
                                title="Revizyon Bekleyen" 
                                value={stats.revizyonBekleyen} 
                                change={-5}
                                Icon={Icons.AlertCircle} 
                                color="bg-orange-500 text-white"
                                subtitle={yaklasanTerminler.length > 0 ? `${yaklasanTerminler.length} yaklaşan termin` : 'Termin takibi yapılıyor'}
                            />
                            <StatCard 
                                title="Toplam Maliyet" 
                                value={`₺${(stats.toplamMaliyet / 1000).toFixed(0)}K`} 
                                change={15}
                                Icon={Icons.DollarSign} 
                                color="bg-purple-500 text-white"
                                subtitle={`Revizyon: ₺${(stats.revizyonMaliyeti / 1000).toFixed(0)}K`}
                            />
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-2 bg-white rounded-xl shadow-sm p-6">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-lg font-semibold flex items-center gap-2">
                                        <Icons.Calendar />
                                        Yaklaşan Terminler
                                    </h3>
                                    {yaklasanTerminler.length > 0 && (
                                        <span className="badge-pulse bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-medium">
                                            {yaklasanTerminler.length} Acil
                                        </span>
                                    )}
                                </div>
                                <div className="space-y-3">
                                    {yaklasanTerminler.length === 0 ? (
                                        <div className="text-center py-8 text-gray-500">
                                            <Icons.CheckCircle className="w-12 h-12 mx-auto mb-2 text-green-500" />
                                            <p>Yaklaşan acil termin bulunmuyor</p>
                                        </div>
                                    ) : (
                                        yaklasanTerminler.slice(0, 5).map(kalip => {
                                            const daysLeft = Math.ceil((new Date(kalip.termin) - new Date()) / (1000 * 60 * 60 * 24));
                                            return (
                                                <div key={kalip.id} className="flex items-center justify-between p-4 bg-gradient-to-r from-orange-50 to-red-50 rounded-lg hover:shadow-md transition-all cursor-pointer"
                                                     onClick={() => { setSelectedKalip(kalip); setModalOpen(true); }}>
                                                    <div className="flex-1">
                                                        <p className="font-medium text-sm">{kalip.ad}</p>
                                                        <p className="text-xs text-gray-600">{kalip.kod} • {kalip.proje}</p>
                                                        <p className="text-xs text-gray-500 mt-1">{kalip.tedarikci}</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-sm font-bold text-red-600">{kalip.termin}</p>
                                                        <p className={`text-xs font-medium ${daysLeft <= 3 ? 'text-red-600' : 'text-orange-600'}`}>
                                                            {daysLeft} gün kaldı
                                                        </p>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>

                            <div className="bg-white rounded-xl shadow-sm p-6">
                                <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                    <Icons.BarChart3 />
                                    Durum Dağılımı
                                </h3>
                                <div className="space-y-4">
                                    {['aktif', 'revizyon', 'deneme', 'pasif'].map(durum => {
                                        const count = kaliplar.filter(k => k.durum === durum).length;
                                        const percentage = kaliplar.length > 0 ? ((count / kaliplar.length) * 100).toFixed(0) : 0;
                                        const colors = {
                                            aktif: 'bg-green-500',
                                            revizyon: 'bg-orange-500',
                                            deneme: 'bg-blue-500',
                                            pasif: 'bg-gray-400'
                                        };
                                        return (
                                            <div key={durum} className="space-y-2">
                                                <div className="flex justify-between text-sm">
                                                    <span className="capitalize font-medium text-gray-700">{durum}</span>
                                                    <span className="text-gray-600 font-semibold">{count} ({percentage}%)</span>
                                                </div>
                                                <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                                    <div 
                                                        className={`h-3 rounded-full ${colors[durum]} transition-all duration-500`}
                                                        style={{ width: `${percentage}%` }}
                                                    />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-6 pt-6 border-t border-gray-200">
                                    <h4 className="text-sm font-semibold mb-3 text-gray-700">Hızlı İstatistikler</h4>
                                    <div className="space-y-2 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Toplam Deneme Baskı</span>
                                            <span className="font-semibold">{stats.toplamDeneme}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Toplam Revizyon</span>
                                            <span className="font-semibold">{stats.toplamRevizyon}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Ortalama Göz Sayısı</span>
                                            <span className="font-semibold">
                                                {kaliplar.length > 0 ? (kaliplar.reduce((sum, k) => sum + k.gozSayisi, 0) / kaliplar.length).toFixed(1) : 0}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-sm p-6">
                            <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                <Icons.FileText />
                                Son Aktiviteler
                            </h3>
                            <div className="space-y-3">
                                {[...allDenemeler.slice(0, 3), ...allRevizyonlar.slice(0, 2)].sort((a, b) => new Date(b.tarih) - new Date(a.tarih)).slice(0, 5).map((item, index) => (
                                    <div key={index} className="flex items-start gap-3 p-3 bg-gray-50 rounded-lg slide-in">
                                        <div className={`p-2 rounded-lg ${item.sonuc ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600'}`}>
                                            {item.sonuc ? <Icons.CheckCircle /> : <Icons.Tool />}
                                        </div>
                                        <div className="flex-1">
                                            <p className="text-sm font-medium">{item.kalipAd}</p>
                                            <p className="text-xs text-gray-600">{item.sonuc ? `Deneme: ${item.sonuc}` : `Revizyon: ${item.islem}`}</p>
                                            <p className="text-xs text-gray-500 mt-1">{item.tarih}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const KalipListesi = () => (
                <div className="bg-white rounded-xl shadow-sm fade-in">
                    <div className="p-6 border-b border-gray-200">
                        <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                            <div className="flex-1 max-w-md">
                                <div className="relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                                        <Icons.Search />

                                    <input
                                        type="text"
                                        placeholder="Kalıp ara (Ad, Kod, Tedarikçi, Proje...)"

                                    <option value="pasif">Pasif</option>

                                    value={tedarikciFilter}

                                >
                                    <Icons.Plus />

                                                    <p className="text-xs text-gray-500">{kalip.malzeme}</p>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4">
                                                <div className="text-sm">
                                                    <p className="font-bold text-gray-900">₺{kalip.maliyet.toLocaleString()}</p>
                                                    <p className="text-xs text-gray-500">{kalip.odemeDurumu}</p>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4">
                                                <div className="flex justify-center gap-2">
                                                    <button 
                                                        onClick={() => { setSelectedKalip(kalip); setModalOpen(true); }}
                                                        className="action-btn p-2 text-blue-600 hover:bg-blue-50 rounded-lg"
                                                        title="Detay Görüntüle"
                                                    >
                                                        <Icons.Eye />
                                                    </button>

                                                        onClick={() => { setSelectedKalip(kalip); setEditKalipModalOpen(true); }}

                                                        title="Düzenle"

                                                        <Icons.Edit />

                                                        className="action-btn p-2 text-red-600 hover:bg-red-50 rounded-lg" 
                                                        title="Sil"
                                                        onClick={() => handleDeleteKalip(kalip.id)}

                                                        <Icons.Trash2 />
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))

                        </div>
                    )}
                </div>
            );

            const DenemeListesi = () => (

                        <h2 className="text-xl font-bold flex items-center gap-2">
                            <Icons.CheckCircle className="text-blue-600" /> Deneme Baskı Yönetimi
                        </h2>
                        <p className="text-sm text-gray-600 mt-1">Tüm kalıplara ait deneme baskı geçmişi ve sonuçları</p>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Kalıp Bilgisi</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Tarih</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Hammadde</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Renk</th>
                                    <th className="px-6 py-4 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">Adet</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Operatör</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Sonuç</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {allDenemeler.length === 0 ? (
                                    <tr>
                                        <td colSpan="7" className="px-6 py-12 text-center text-gray-500">
                                            <Icons.CheckCircle className="w-16 h-16 mx-auto mb-3 text-gray-300" />
                                            <p className="text-lg font-medium">Henüz deneme baskı kaydı bulunmuyor</p>
                                        </td>
                                    </tr>
                                ) : (
                                    allDenemeler.map((deneme, index) => (
                                        <tr key={`${deneme.kalipId}-${deneme.id}`} className="table-row" style={{ animationDelay: `${index * 50}ms` }}>
                                            <td className="px-6 py-4">
                                                <p className="text-sm font-semibold text-gray-900">{deneme.kalipAd}</p>
                                                <p className="text-xs text-gray-500">{deneme.kalipKod} • {deneme.proje}</p>
                                            </td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{deneme.tarih}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{deneme.hammadde}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{deneme.renk}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900 text-right font-semibold">{deneme.adet.toLocaleString()}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{deneme.operator || '-'}</td>
                                            <td className="px-6 py-4">
                                                <span className={`text-sm ${deneme.sonuc.includes('Onay') ? 'text-green-700 font-semibold' : 'text-orange-700'}`}>
                                                    {deneme.sonuc}
                                                </span>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const RevizyonListesi = () => (
                <div className="bg-white rounded-xl shadow-sm fade-in">
                    <div className="p-6 border-b border-gray-200">
                        <h2 className="text-xl font-bold flex items-center gap-2">
                            <Icons.Tool className="text-orange-600" /> Revizyon Takibi
                        </h2>
                        <p className="text-sm text-gray-600 mt-1">Tüm kalıplara ait revizyon geçmişi, maliyetler ve ödeme durumları</p>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Kalıp Bilgisi</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Tarih</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Sorumlu Firma</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Yapılan İşlem</th>
                                    <th className="px-6 py-4 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">Fiyat</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Ödeme Durumu</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {allRevizyonlar.length === 0 ? (
                                    <tr>
                                        <td colSpan="6" className="px-6 py-12 text-center text-gray-500">
                                            <Icons.Tool className="w-16 h-16 mx-auto mb-3 text-gray-300" />
                                            <p className="text-lg font-medium">Henüz revizyon kaydı bulunmuyor</p>
                                        </td>
                                    </tr>
                                ) : (
                                    allRevizyonlar.map((revizyon, index) => (
                                        <tr key={`${revizyon.kalipId}-${revizyon.id}`} className="table-row" style={{ animationDelay: `${index * 50}ms` }}>
                                            <td className="px-6 py-4">
                                                <p className="text-sm font-semibold text-gray-900">{revizyon.kalipAd}</p>
                                                <p className="text-xs text-gray-500">{revizyon.kalipKod} • {revizyon.proje}</p>
                                            </td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{revizyon.tarih}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{revizyon.firma}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900 max-w-xs">{revizyon.islem}</td>
                                            <td className="px-6 py-4 text-sm text-right">
                                                <span className={`font-bold ${revizyon.fiyat > 0 ? 'text-red-600' : 'text-green-600'}`}>
                                                    {revizyon.fiyat > 0 ? `₺${revizyon.fiyat.toLocaleString()}` : 'Garantili'}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4">
                                                <span className={`px-3 py-1 rounded-full text-xs font-medium ${
                                                    revizyon.odemeDurumu === 'Ödendi' ? 'bg-green-100 text-green-700' :
                                                    revizyon.odemeDurumu === 'Garanti kapsamında' ? 'bg-blue-100 text-blue-700' :
                                                    'bg-orange-100 text-orange-700'
                                                }`}>
                                                    {revizyon.odemeDurumu}
                                                </span>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const BakimListesi = () => (
                <div className="bg-white rounded-xl shadow-sm fade-in">
                    <div className="p-6 border-b border-gray-200">
                        <h2 className="text-xl font-bold flex items-center gap-2">
                            <Icons.Settings className="text-purple-600" /> Bakım Kayıtları
                        </h2>
                        <p className="text-sm text-gray-600 mt-1">Kalıp bakım geçmişi ve planlanan bakımlar</p>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Kalıp Bilgisi</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Tarih</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Yapılan İşlem</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Sorumlu</th>
                                    <th className="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Durum</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {allBakimlar.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="px-6 py-12 text-center text-gray-500">
                                            <Icons.Settings className="w-16 h-16 mx-auto mb-3 text-gray-300" />
                                            <p className="text-lg font-medium">Henüz bakım kaydı bulunmuyor</p>
                                        </td>
                                    </tr>
                                ) : (
                                    allBakimlar.map((bakim, index) => (
                                        <tr key={`${bakim.kalipId}-${bakim.id}`} className="table-row" style={{ animationDelay: `${index * 50}ms` }}>
                                            <td className="px-6 py-4">
                                                <p className="text-sm font-semibold text-gray-900">{bakim.kalipAd}</p>
                                                <p className="text-xs text-gray-500">{bakim.kalipKod}</p>
                                            </td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{bakim.tarih}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{bakim.islem}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900">{bakim.sorumlu}</td>
                                            <td className="px-6 py-4">
                                                <span className={`px-3 py-1 rounded-full text-xs font-medium ${
                                                    bakim.durum === 'Tamamlandı' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'
                                                }`}>
                                                    {bakim.durum}
                                                </span>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const RaporlarPage = () => {
                const toplamMaliyet = kaliplar.reduce((sum, k) => sum + k.maliyet, 0);
                const revizyonMaliyeti = allRevizyonlar.reduce((sum, r) => sum + r.fiyat, 0);
                const tedarikciIstatistik = useMemo(() => {
                    const stats = {};
                    kaliplar.forEach(k => {
                        if (!stats[k.tedarikci]) {
                            stats[k.tedarikci] = { count: 0, maliyet: 0 };
                        }
                        stats[k.tedarikci].count++;
                        stats[k.tedarikci].maliyet += k.maliyet;
                    });
                    return Object.entries(stats).sort((a, b) => b[1].count - a[1].count);
                }, []);

                const malzemeIstatistik = useMemo(() => {
                    const stats = {};
                    kaliplar.forEach(k => {
                        stats[k.malzeme] = (stats[k.malzeme] || 0) + 1;
                    });
                    return Object.entries(stats).sort((a, b) => b[1] - a[1]);
                }, []);

                return (
                    <div className="space-y-6 fade-in">
                        <div className="bg-white rounded-xl shadow-sm p-6">
                            <h2 className="text-2xl font-bold mb-6 flex items-center gap-2">
                                <Icons.BarChart3 className="text-blue-600" />
                                Raporlama ve Analiz
                            </h2>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-xl">
                                    <div className="flex items-center justify-between mb-2">
                                        <h3 className="text-sm font-medium text-blue-900">Toplam Yatırım</h3>
                                        <Icons.DollarSign className="text-blue-600" />
                                    </div>
                                    <p className="text-3xl font-bold text-blue-900">₺{(toplamMaliyet / 1000).toFixed(0)}K</p>
                                    <p className="text-xs text-blue-700 mt-1">{kaliplar.length} kalıp</p>
                                </div>

                                <div className="bg-gradient-to-br from-orange-50 to-orange-100 p-6 rounded-xl">
                                    <div className="flex items-center justify-between mb-2">
                                        <h3 className="text-sm font-medium text-orange-900">Revizyon Maliyeti</h3>
                                        <Icons.Tool className="text-orange-600" />
                                    </div>
                                    <p className="text-3xl font-bold text-orange-900">₺{(revizyonMaliyeti / 1000).toFixed(0)}K</p>
                                    <p className="text-xs text-orange-700 mt-1">{allRevizyonlar.length} revizyon</p>
                                </div>

                                <div className="bg-gradient-to-br from-green-50 to-green-100 p-6 rounded-xl">
                                    <div className="flex items-center justify-between mb-2">
                                        <h3 className="text-sm font-medium text-green-900">Başarı Oranı</h3>
                                        <Icons.CheckCircle className="text-green-600" />
                                    </div>
                                    <p className="text-3xl font-bold text-green-900">
                                        {allDenemeler.length > 0 ? 
                                            Math.round((allDenemeler.filter(d => d.sonuc.includes('Onay')).length / allDenemeler.length) * 100) 
                                            : 0}%
                                    </p>
                                    <p className="text-xs text-green-700 mt-1">{allDenemeler.length} deneme</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="border border-gray-200 rounded-xl p-6">
                                    <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                        <Icons.Package className="text-blue-600" />
                                        Tedarikçi Analizi
                                    </h3>
                                    <div className="space-y-3">
                                        {tedarikciIstatistik.map(([tedarikci, data]) => (
                                            <div key={tedarikci} className="p-4 bg-gray-50 rounded-lg">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-medium text-gray-900">{tedarikci}</span>
                                                    <span className="text-sm font-semibold text-blue-600">{data.count} kalıp</span>
                                                </div>
                                                <div className="flex justify-between text-sm text-gray-600">
                                                    <span>Toplam Maliyet</span>
                                                    <span className="font-bold">₺{(data.maliyet / 1000).toFixed(0)}K</span>
                                                </div>
                                                <div className="mt-2 w-full bg-gray-200 rounded-full h-2">
                                                    <div 
                                                        className="bg-blue-500 h-2 rounded-full"
                                                        style={{ width: `${(data.count / kaliplar.length) * 100}%` }}
                                                    />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="border border-gray-200 rounded-xl p-6">
                                    <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                        <Icons.FileText className="text-purple-600" />
                                        Malzeme Dağılımı
                                    </h3>
                                    <div className="space-y-3">
                                        {malzemeIstatistik.map(([malzeme, count]) => {
                                            const percentage = ((count / kaliplar.length) * 100).toFixed(0);
                                            return (
                                                <div key={malzeme} className="p-4 bg-gray-50 rounded-lg">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="font-medium text-gray-900">{malzeme}</span>
                                                        <span className="text-sm font-semibold text-purple-600">{count} kalıp ({percentage}%)</span>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                                        <div 
                                                            className="bg-purple-500 h-2 rounded-full"
                                                            style={{ width: `${percentage}%` }}
                                                        />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="mt-6 p-6 border border-gray-200 rounded-xl">
                                <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                    <Icons.Download className="text-green-600" />
                                    Rapor Dışa Aktarma
                                </h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <button 
                                        onClick={exportToCSV}
                                        className="flex items-center justify-center gap-2 px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-medium"
                                    >
                                        <Icons.Download />
                                        Kalıp Listesi (CSV)
                                    </button>
                                    <button className="flex items-center justify-center gap-2 px-6 py-3 border-2 border-blue-500 text-blue-600 rounded-lg hover:bg-blue-50 transition-colors font-medium">
                                        <Icons.FileText />
                                        Detaylı Rapor (PDF)
                                    </button>
                                    <button className="flex items-center justify-center gap-2 px-6 py-3 border-2 border-purple-500 text-purple-600 rounded-lg hover:bg-purple-50 transition-colors font-medium">
                                        <Icons.BarChart3 />
                                        Grafik Raporu
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const ArsivPage = () => {
                const pasifKaliplar = kaliplar.filter(k => k.durum === 'pasif');
                
                return (
                    <div className="bg-white rounded-xl shadow-sm fade-in">
                        <div className="p-6 border-b border-gray-200">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <Icons.Archive className="text-gray-600" /> Arşiv ve Geçmiş Kayıtlar
                            </h2>
                            <p className="text-sm text-gray-600 mt-1">Tamamlanmış ve pasif durumdaki kalıplar</p>
                        </div>
                        <div className="p-6">
                            {pasifKaliplar.length === 0 ? (
                                <div className="text-center py-12 text-gray-500">
                                    <Icons.Archive className="w-16 h-16 mx-auto mb-3 text-gray-300" />
                                    <p className="text-lg font-medium">Arşivde kalıp bulunmuyor</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {pasifKaliplar.map(kalip => (
                                        <div 
                                            key={kalip.id} 
                                            className="p-5 border-2 border-gray-200 rounded-xl hover:border-blue-300 hover:shadow-lg transition-all cursor-pointer"
                                            onClick={() => { setSelectedKalip(kalip); setModalOpen(true); }}
                                        >
                                            <div className="flex items-start justify-between mb-3">
                                                <div>
                                                    <h3 className="font-semibold text-gray-900">{kalip.ad}</h3>
                                                    <p className="text-xs text-gray-500">{kalip.kod}</p>
                                                </div>
                                                {getDurumBadge(kalip.durum)}
                                            </div>
                                            <div className="space-y-2 text-sm">
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">Proje:</span>
                                                    <span className="font-medium">{kalip.proje}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">Tedarikçi:</span>
                                                    <span className="font-medium">{kalip.tedarikci}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">Maliyet:</span>
                                                    <span className="font-bold text-gray-900">₺{kalip.maliyet.toLocaleString()}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const Modal = ({ show, onClose, title, children, size = 'max-w-2xl' }) => {
                if (!show) return null;
                return (
                    <div className="fixed inset-0 bg-black bg-opacity-50 modal-backdrop flex items-center justify-center z-50 p-4" onClick={onClose}>
                        <div 
                            className={`bg-white rounded-xl shadow-2xl ${size} w-full max-h-[90vh] flex flex-col fade-in`}
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div className="p-6 border-b border-gray-200 flex items-center justify-between sticky top-0 bg-white rounded-t-xl">
                                <h2 className="text-2xl font-bold text-gray-900">{title}</h2>
                                <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg transition-colors text-gray-500">
                                    <Icons.X />
                                </button>
                            </div>
                            <div className="p-6 space-y-4 overflow-y-auto modal-body">
                                {children}
                            </div>
                        </div>
                    </div>
                );
            };

            const Input = ({ label, ...props }) => (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
                    <input {...props} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                </div>
            );

            const Select = ({ label, children, ...props }) => (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
                    <select {...props} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white">
                        {children}
                    </select>
                </div>
            );

            const TextArea = ({ label, ...props }) => (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
                    <textarea {...props} rows="3" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                </div>
            );

            const FormButton = ({ children, variant = 'primary', ...props }) => {
                const variants = {
                    primary: 'bg-blue-500 hover:bg-blue-600 text-white',
                    secondary: 'bg-gray-500 hover:bg-gray-600 text-white'
                };
                return (
                    <button {...props} className={`w-full px-4 py-2.5 rounded-lg transition-colors font-medium ${variants[variant]}`}>
                        {children}
                    </button>
                );
            };

            const YeniKalipModal = () => {
                const handleSubmit = (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);

// ------- User, Notifications, Settings Handlers & Components -------
const handleLogout = () => {
    localStorage.removeItem('authToken');
    localStorage.removeItem('kullanici');
    // redirect to login
    window.location.href = 'login.html';
};

const handleChangePassword = async (eskiSifre, yeniSifre) => {
    try {
        const resp = await fetch(`${API_URL}/auth/change-password`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ eskiSifre, yeniSifre })
        });
        if (resp.status === 401) return handleLogout();
        if (!resp.ok) throw new Error('Şifre değiştirilemedi');
        alert('✅ Şifre başarıyla değiştirildi');
        setSettingsModalOpen(false);
    } catch (err) {
        console.error('Şifre değiştirme hatası:', err);
        alert('❌ ' + (err.message || 'Şifre değiştirme sırasında hata oluştu'));
    }
};

const SettingsModal = () => {
    const [oldPass, setOldPass] = useState('');
    const [newPass, setNewPass] = useState('');
    const [changing, setChanging] = useState(false);

    if (!settingsModalOpen) return null;

    const onSubmit = async (e) => {
        e.preventDefault();
        if (!oldPass || !newPass) return alert('Lütfen tüm alanları doldurun');
        if (newPass.length < 6) return alert('Yeni şifre en az 6 karakter olmalı');
        setChanging(true);
        await handleChangePassword(oldPass, newPass);
        setChanging(false);
    };

    return (
        <Modal show={settingsModalOpen} onClose={() => setSettingsModalOpen(false)} title="Ayarlar / Profil">
            <div className="space-y-4">
                <div>
                    <p className="text-sm text-gray-600">Giriş yapan kullanıcı</p>
                    <p className="font-medium">{currentUser ? `${currentUser.adSoyad} (${currentUser.kullaniciAdi})` : '—'}</p>
                    <p className="text-xs text-gray-500">Rol: {currentUser ? currentUser.rol : '—'}</p>
                </div>

                <form onSubmit={onSubmit} className="grid grid-cols-1 gap-3">
                    <Input label="Eski Şifre" type="password" value={oldPass} onChange={(e) => setOldPass(e.target.value)} required />
                    <Input label="Yeni Şifre" type="password" value={newPass} onChange={(e) => setNewPass(e.target.value)} required />
                    <div>
                        <FormButton type="submit">{changing ? 'Değiştiriliyor...' : 'Şifreyi Değiştir'}</FormButton>
                    </div>
                </form>
                <div className="pt-4 border-t border-gray-200">
                    <button onClick={handleLogout} className="px-4 py-2 bg-red-500 text-white rounded-lg">Çıkış Yap</button>
                </div>
            </div>
        </Modal>
    );
};

const NotificationsPanel = () => {
    if (!notificationsOpen) return null;
    const today = new Date();
    const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
    const yaklasan = kaliplar.filter(k => {
        const termin = new Date(k.termin);
        return k.durum !== 'pasif' && termin >= today && termin <= nextWeek;
    });
    const revizyonList = kaliplar.filter(k => k.durum === 'revizyon');

    return (
        <div className="absolute right-0 mt-12 w-80 bg-white rounded-xl shadow-lg z-50 p-4">
            <h4 className="font-semibold mb-2">Bildirimler</h4>
            {yaklasan.length === 0 && revizyonList.length === 0 ? (
                <p className="text-sm text-gray-500">Yeni bildirim yok</p>
            ) : (
                <div className="space-y-2 max-h-64 overflow-y-auto">
                    {yaklasan.map(k => (
                        <div key={`n-y-${k.id}`} className="p-2 rounded-lg bg-orange-50">
                            <p className="text-sm font-medium">Yaklaşan termin: {k.ad}</p>
                            <p className="text-xs text-gray-600">Termin: {k.termin} • {k.proje}</p>
                        </div>
                    ))}
                    {revizyonList.map(k => (
                        <div key={`n-r-${k.id}`} className="p-2 rounded-lg bg-yellow-50">
                            <p className="text-sm font-medium">Revizyon: {k.ad}</p>
                            <p className="text-xs text-gray-600">Tedarikçi: {k.tedarikci}</p>
                        </div>
                    ))}
                </div>
            )}
            <div className="mt-3 text-right">
                <button onClick={() => { setNotificationsOpen(false); setActiveTab('kaliplar'); }} className="text-sm text-blue-600">Tümünü Gör</button>
            </div>
        </div>
    );
};
// KalipTakipApp fonksiyonunun içinde, return'den önce

// ✅ Loading durumu
if (loading) {
    return (
        <div className="min-h-screen flex items-center justify-center bg-gray-50">
            <div className="text-center">
                <div className="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mx-auto mb-4"></div>
                <p className="text-gray-600 text-lg">Veriler yükleniyor...</p>
            </div>
        </div>
    );
}

// ✅ Error durumu
if (error) {
    return (
        <div className="min-h-screen flex items-center justify-center bg-gray-50">
            <div className="text-center p-8 bg-white rounded-xl shadow-lg max-w-md">
                <div className="text-red-500 text-5xl mb-4">⚠️</div>
                <h2 className="text-xl font-bold text-gray-900 mb-2">Bağlantı Hatası</h2>
                <p className="text-gray-600 mb-4">{error}</p>
                <button 
                    onClick={loadKaliplar}
                    className="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600"
                >
                    Tekrar Dene
                </button>
            </div>
        </div>
    );
}

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-50 via-blue-50 to-gray-100">
                    <header className="bg-white shadow-md border-b border-gray-200 sticky top-0 z-40">
                        <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 gradient-bg rounded-xl flex items-center justify-center text-white shadow-lg">
                                        <Icons.ClipboardList />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900">Kalıp Takip Sistemi</h1>
                                        <p className="text-xs text-gray-500">Yaşam Döngüsü Yönetimi v2.0</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3 relative">
                                    <div className="relative">
                                        <button onClick={() => setNotificationsOpen(v => !v)} className="p-2 hover:bg-gray-100 rounded-lg transition-colors relative text-gray-600">
                                            <Icons.Bell />
                                            {notificationCount > 0 && (
                                                <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">
                                                    {notificationCount}
                                                </span>
                                            )}
                                        </button>
                                        <NotificationsPanel />
                                    </div>

                                    <button onClick={() => setSettingsModalOpen(true)} className="p-2 hover:bg-gray-100 rounded-lg transition-colors text-gray-600" title="Ayarlar">
                                        <Icons.Settings />
                                    </button>

                                    <div className="relative">
                                        <button onClick={() => setUserMenuOpen(v => !v)} className="flex items-center gap-2 pl-3 border-l border-gray-200">
                                            <div className="w-9 h-9 gradient-bg rounded-full flex items-center justify-center text-white shadow-md">
                                                <Icons.User />
                                            </div>
                                            <div className="hidden md:block text-left">
                                                <p className="text-sm font-medium text-gray-700">{currentUser ? currentUser.adSoyad : '...'}</p>
                                                <p className="text-xs text-gray-500">{currentUser ? currentUser.rol : ''}</p>
                                            </div>
                                            <Icons.ChevronDown />
                                        </button>

                                        {userMenuOpen && (
                                            <div className="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg z-50 p-2">
                                                <button onClick={() => { setSettingsModalOpen(true); setUserMenuOpen(false); }} className="w-full text-left px-3 py-2 rounded hover:bg-gray-100">Profil / Ayarlar</button>
                                                <button onClick={() => { setUserMenuOpen(false); setActiveTab('kullanicilar'); }} className="w-full text-left px-3 py-2 rounded hover:bg-gray-100">Hesap</button>
                                                <div className="border-t my-1"></div>
                                                <button onClick={handleLogout} className="w-full text-left px-3 py-2 rounded text-red-600 hover:bg-red-50">Çıkış Yap</button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <nav className="bg-white shadow-sm border-b border-gray-200 sticky top-16 z-30">
                        <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex gap-1 overflow-x-auto">
                                {[
                                    { id: 'dashboard', label: 'Dashboard', Icon: Icons.BarChart3 },
                                    { id: 'kaliplar', label: 'Kalıplar', Icon: Icons.Package },
                                    { id: 'deneme', label: 'Deneme Baskı', Icon: Icons.CheckCircle },
                                    { id: 'revizyon', label: 'Revizyonlar', Icon: Icons.AlertCircle },
                                    { id: 'bakim', label: 'Bakım', Icon: Icons.Settings },
                                    { id: 'raporlar', label: 'Raporlar', Icon: Icons.FileText },
                                    { id: 'arsiv', label: 'Arşiv', Icon: Icons.Archive }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-4 py-3 border-b-2 transition-all whitespace-nowrap ${
                                            activeTab === tab.id
                                                ? 'border-blue-500 text-blue-600 bg-blue-50'
                                                : 'border-transparent text-gray-600 hover:text-gray-900 hover:bg-gray-50'
                                        }`}
                                    >
                                        <tab.Icon />
                                        <span className="text-sm font-medium">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'dashboard' && <Dashboard />}
                        {activeTab === 'kaliplar' && <KalipListesi />}
                        {activeTab === 'deneme' && <DenemeListesi />}
                        {activeTab === 'revizyon' && <RevizyonListesi />}
                        {activeTab === 'bakim' && <BakimListesi />}
                        {activeTab === 'raporlar' && <RaporlarPage />}
                        {activeTab === 'arsiv' && <ArsivPage />}
                    </main>

                    <footer className="bg-white border-t border-gray-200 mt-12">
                        <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                <p className="text-sm text-gray-600">© 2024 Kalıp Takip Sistemi - Tüm hakları saklıdır</p>
                                <div className="flex gap-4 text-sm text-gray-600">
                                    <a href="#" className="hover:text-blue-600 transition-colors">Yardım</a>
                                    <a href="#" className="hover:text-blue-600 transition-colors">Dokümantasyon</a>
                                    <a href="#" className="hover:text-blue-600 transition-colors">İletişim</a>
                                </div>
                            </div>
                        </div>
                    </footer>

                    <KalipDetayModal />
                    <YeniKalipModal />
                    <EditKalipModal />
                    <SettingsModal />
                    {selectedKalip && <DenemeBaskiModal />}
                    {selectedKalip && <RevizyonModal />}
                    {selectedKalip && <BakimModal />}
                </div>
            );
        };

        
        ReactDOM.render(<KalipTakipApp />, document.getElementById('root'));
    </script>
</body>
</html>
